[project]
name = "tesouro-direto-mcp"
version = "0.1.0"
description = "MCP server for Brazilian government bonds (Tesouro Direto): historical prices, yields and the ANBIMA yield curve"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marcelo S. Perlin", email = "marceloperlin@gmail.com" }]
keywords = ["mcp", "tesouro-direto", "brazil", "bonds", "fixed-income", "finance"]
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.scripts]
tesouro-direto-mcp = "tesouro_direto_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/msperlin/tesouro-direto-mcp"
Source = "https://github.com/msperlin/tesouro-direto-mcp"
Issues = "https://github.com/msperlin/tesouro-direto-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tesouro_direto_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
